<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="tile" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#CFCAC0"/>
      <path d="M0 .5H80M.5 0V80" stroke="#BDB7AB" stroke-width="2"/>
      <circle cx="22" cy="58" r="1.6" fill="#B3ADA0"/>
      <circle cx="61" cy="19" r="1.3" fill="#B3ADA0"/>
    </pattern>
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#FFD45E"/>
      <rect width="14" height="28" fill="#30353E"/>
    </pattern>
  </defs>
  <!-- 옥상 바닥 -->
  <rect width="1600" height="1000" fill="url(#tile)"/>
  <!-- 난간(파라펫) -->
  <path d="M0 0H1600V1000H0Z M22 22V978H1578V22Z" fill-rule="evenodd" fill="#9C978E"/>
  <rect x="22" y="22" width="1556" height="956" fill="none" stroke="#30353E" stroke-width="4"/>
  <rect x="3" y="3" width="1594" height="994" fill="none" stroke="#30353E" stroke-width="6"/>
  <!-- 레일 통로: 양 팀이 서는 페인트 구역 -->
  <rect x="60" y="62" width="1480" height="60" rx="10" fill="#E3DED3" stroke="#D56A26" stroke-width="3" stroke-dasharray="18 12" opacity=".9"/>
  <rect x="60" y="862" width="1480" height="60" rx="10" fill="#E3DED3" stroke="#247BDB" stroke-width="3" stroke-dasharray="18 12" opacity=".9"/>
  <!-- 가운데 헬리패드 (전투기 항로) -->
  <circle cx="800" cy="500" r="118" fill="#B9B4AA" stroke="#30353E" stroke-width="4"/>
  <circle cx="800" cy="500" r="100" fill="none" stroke="#FFD45E" stroke-width="12"/>
  <path d="M766 450v100M834 450v100M766 500h68" stroke="#FFFFFF" stroke-width="18" stroke-linecap="square"/>
  <!-- 에어컨 실외기 -->
  <g stroke="#30353E" stroke-width="3">
    <rect x="70" y="210" width="120" height="80" rx="6" fill="#E8E6E1"/>
    <circle cx="112" cy="250" r="28" fill="#C9CDD2"/>
    <path d="M112 222v56M84 250h56" stroke-width="2"/>
    <rect x="150" y="220" width="30" height="60" rx="3" fill="#D5D3CE"/>
    <rect x="70" y="310" width="120" height="80" rx="6" fill="#E8E6E1"/>
    <circle cx="112" cy="350" r="28" fill="#C9CDD2"/>
    <path d="M112 322v56M84 350h56" stroke-width="2"/>
    <rect x="150" y="320" width="30" height="60" rx="3" fill="#D5D3CE"/>
  </g>
  <!-- 물탱크 -->
  <g stroke="#30353E" stroke-width="3">
    <circle cx="1470" cy="500" r="46" fill="#7FA7C9"/>
    <circle cx="1470" cy="500" r="30" fill="#96B8D4"/>
    <circle cx="1470" cy="500" r="8" fill="#30353E"/>
  </g>
  <!-- 환기구·옥탑 출입구 -->
  <g stroke="#30353E" stroke-width="3">
    <rect x="80" y="580" width="150" height="120" rx="4" fill="#A9A49B"/>
    <rect x="120" y="650" width="70" height="50" fill="#6B6F76"/>
    <circle cx="178" cy="676" r="4" fill="#FFD45E" stroke="none"/>
    <circle cx="1180" cy="380" r="22" fill="#C9CDD2"/>
    <path d="M1162 380h36M1180 362v36" stroke-width="2"/>
    <circle cx="1230" cy="440" r="16" fill="#C9CDD2"/>
    <circle cx="420" cy="620" r="22" fill="#C9CDD2"/>
    <path d="M402 620h36M420 602v36" stroke-width="2"/>
  </g>
  <!-- 가장자리 경고 띠 -->
  <rect x="22" y="22" width="1556" height="10" fill="url(#hazard)" opacity=".85"/>
  <rect x="22" y="968" width="1556" height="10" fill="url(#hazard)" opacity=".85"/>
</svg>
