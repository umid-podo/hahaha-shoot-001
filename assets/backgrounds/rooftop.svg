<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <pattern id="tile" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#CFCAC0"/>
      <path d="M0 .5H80M.5 0V80" stroke="#BDB7AB" stroke-width="2"/>
      <circle cx="22" cy="58" r="1.6" fill="#B3ADA0"/>
      <circle cx="61" cy="19" r="1.3" fill="#B3ADA0"/>
    </pattern>
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#FFD45E"/>
      <rect width="14" height="28" fill="#30353E"/>
    </pattern>
  </defs>
  <!-- 옥상 바닥 -->
  <rect width="1200" height="800" fill="url(#tile)"/>
  <!-- 난간(파라펫) -->
  <path d="M0 0H1200V800H0Z M22 22V778H1178V22Z" fill-rule="evenodd" fill="#9C978E"/>
  <rect x="22" y="22" width="1156" height="756" fill="none" stroke="#30353E" stroke-width="4"/>
  <rect x="3" y="3" width="1194" height="794" fill="none" stroke="#30353E" stroke-width="6"/>
  <!-- 레일 통로: 양 팀이 서는 페인트 구역 -->
  <rect x="60" y="62" width="1080" height="60" rx="10" fill="#E3DED3" stroke="#D56A26" stroke-width="3" stroke-dasharray="18 12" opacity=".9"/>
  <rect x="60" y="662" width="1080" height="60" rx="10" fill="#E3DED3" stroke="#247BDB" stroke-width="3" stroke-dasharray="18 12" opacity=".9"/>
  <!-- 가운데 헬리패드 (전투기 항로) -->
  <circle cx="600" cy="400" r="118" fill="#B9B4AA" stroke="#30353E" stroke-width="4"/>
  <circle cx="600" cy="400" r="100" fill="none" stroke="#FFD45E" stroke-width="12"/>
  <path d="M566 350v100M634 350v100M566 400h68" stroke="#FFFFFF" stroke-width="18" stroke-linecap="square"/>
  <!-- 에어컨 실외기 -->
  <g stroke="#30353E" stroke-width="3">
    <rect x="70" y="190" width="120" height="80" rx="6" fill="#E8E6E1"/>
    <circle cx="112" cy="230" r="28" fill="#C9CDD2"/>
    <path d="M112 202v56M84 230h56" stroke-width="2"/>
    <rect x="150" y="200" width="30" height="60" rx="3" fill="#D5D3CE"/>
    <rect x="70" y="290" width="120" height="80" rx="6" fill="#E8E6E1"/>
    <circle cx="112" cy="330" r="28" fill="#C9CDD2"/>
    <path d="M112 302v56M84 330h56" stroke-width="2"/>
    <rect x="150" y="300" width="30" height="60" rx="3" fill="#D5D3CE"/>
  </g>
  <!-- 물탱크 -->
  <g stroke="#30353E" stroke-width="3">
    <circle cx="1070" cy="400" r="46" fill="#7FA7C9"/>
    <circle cx="1070" cy="400" r="30" fill="#96B8D4"/>
    <circle cx="1070" cy="400" r="8" fill="#30353E"/>
  </g>
  <!-- 환기구·옥탑 출입구 -->
  <g stroke="#30353E" stroke-width="3">
    <rect x="80" y="470" width="150" height="120" rx="4" fill="#A9A49B"/>
    <rect x="120" y="540" width="70" height="50" fill="#6B6F76"/>
    <circle cx="178" cy="566" r="4" fill="#FFD45E" stroke="none"/>
    <circle cx="880" cy="230" r="22" fill="#C9CDD2"/>
    <path d="M862 230h36M880 212v36" stroke-width="2"/>
    <circle cx="930" cy="290" r="16" fill="#C9CDD2"/>
  </g>
  <!-- 가장자리 경고 띠 -->
  <rect x="22" y="22" width="1156" height="10" fill="url(#hazard)" opacity=".85"/>
  <rect x="22" y="768" width="1156" height="10" fill="url(#hazard)" opacity=".85"/>
</svg>
