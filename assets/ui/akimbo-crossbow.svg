<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
<!-- 아킴보 석궁: 권총 손잡이가 달린 검은 소형 석궁 두 자루(앞쪽 활대·줄·은색 화살과 삼각 화살촉). 오른쪽을 향한다. -->
<defs>
  <g id="xbow" stroke="#16181C" stroke-linejoin="round" stroke-linecap="round">
    <!-- 줄: 활대 끝에서 뒤쪽 걸쇠로 -->
    <path d="M44 12L96 36L44 60" fill="none" stroke="#2A2D33" stroke-width="1.6"/>
    <!-- 몸통 레일 -->
    <path d="M28 30h92l6 6v8H34l-6-6z" fill="#2B2F36" stroke-width="2"/>
    <path d="M40 40h60" fill="none" stroke="#454B55" stroke-width="3"/>
    <rect x="58" y="34" width="26" height="6" rx="2" fill="#1C1F24" stroke-width="1.5"/>
    <!-- 뒤쪽 위 조준 블록 -->
    <path d="M100 22h22v14h-22z" fill="#23262C" stroke-width="2"/>
    <path d="M104 18h8v6h-8zM114 18h6v6h-6z" fill="#1C1F24" stroke-width="1.5"/>
    <!-- 권총 손잡이와 방아쇠 울 -->
    <path d="M104 42h18l6 34q-2 6-10 6h-8q-4-2-4-8z" fill="#1F2227" stroke-width="2"/>
    <path d="M108 50l10 0l2 22" fill="none" stroke="#3A3F47" stroke-width="2"/>
    <path d="M86 44q0 14 12 14h6" fill="none" stroke-width="3"/>
    <path d="M96 46v6" fill="none" stroke-width="2.5"/>
    <!-- 앞쪽 활대(위아래로 휜 팔) -->
    <path d="M40 34Q30 22 44 10l6 2Q40 22 46 34z" fill="#2B2F36" stroke-width="2"/>
    <path d="M40 38Q30 50 44 62l6-2Q40 50 46 38z" fill="#2B2F36" stroke-width="2"/>
    <rect x="34" y="28" width="16" height="18" rx="3" fill="#1C1F24" stroke-width="2"/>
    <!-- 은색 화살과 삼각 화살촉 -->
    <path d="M22 27h90" fill="none" stroke="#9EA6B0" stroke-width="3.5"/>
    <path d="M22 27h90" fill="none" stroke="#E4E8EC" stroke-width="1.2"/>
    <path d="M6 27L24 20v14z" fill="#C9CFD6" stroke="#5B636E" stroke-width="1.5"/>
    <path d="M6 27L24 27" fill="none" stroke="#F4F6F8" stroke-width="1"/>
  </g>
</defs>
<g transform="translate(200 0) scale(-1 1)"><use href="#xbow" transform="translate(4 6)"/><use href="#xbow" transform="translate(52 64)"/></g>
</svg>
