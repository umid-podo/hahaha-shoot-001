<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- 에너지 RPG(전설): 에너지 돌격소총·쌍권총과 같은 흰 외장판·검은 몸통·푸르게 빛나는 띠와 육각 문양 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B3E8C"/><stop offset="1" stop-color="#16205A"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#E4EAF0"/><stop offset="1" stop-color="#B9C3CC"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="300" height="300" fill="url(#bg)"/>
  <g transform="translate(150 150) rotate(-38) translate(-150 -150)">
    <!-- 뒤 나팔관 -->
    <path d="M18 132 L52 140 L52 160 L18 168 Z" fill="#1A1D23"/>
    <ellipse cx="18" cy="150" rx="5" ry="18" fill="#2FD8F0" filter="url(#glow)"/>
    <!-- 발사관 -->
    <rect x="50" y="138" width="196" height="24" rx="6" fill="#1A1D23"/>
    <rect x="80" y="133" width="78" height="34" rx="9" fill="url(#white)"/>
    <rect x="166" y="135" width="62" height="30" rx="8" fill="url(#white)"/>
    <rect x="76" y="133" width="6" height="34" fill="#1A1D23"/><rect x="158" y="133" width="8" height="34" fill="#1A1D23"/><rect x="226" y="133" width="6" height="34" fill="#1A1D23"/>
    <!-- 푸른 빛 띠 -->
    <rect x="88" y="146" width="62" height="6" rx="3" fill="#A8FBFF" filter="url(#glow)"/>
    <rect x="172" y="146" width="50" height="6" rx="3" fill="#A8FBFF" filter="url(#glow)"/>
    <!-- 앞 덮개 · 에너지 탄두 -->
    <path d="M232 131 L252 135 L252 165 L232 169 Z" fill="#1A1D23"/>
    <path d="M252 140 L262 136 L282 142 L292 150 L282 158 L262 164 L252 160 Z" fill="#7FF4FF" filter="url(#glow)"/>
    <!-- 위 흰 조준경 -->
    <rect x="128" y="112" width="52" height="16" rx="5" fill="url(#white)"/>
    <rect x="150" y="126" width="8" height="10" fill="#1A1D23"/>
    <circle cx="180" cy="120" r="5" fill="#2FD8F0" filter="url(#glow)"/>
    <!-- 손잡이 두 개 · 육각 문양 -->
    <path d="M150 162 L166 162 L160 204 L144 202 Z" fill="#1A1D23"/>
    <path d="M86 162 L100 162 L96 196 L82 194 Z" fill="#1A1D23"/>
    <polygon points="186,166 196,160 206,166 206,178 196,184 186,178" fill="#1A1D23"/>
    <polygon points="191,169 196,166 201,169 201,175 196,178 191,175" fill="none" stroke="#7FF4FF" stroke-width="2.5" filter="url(#glow)"/>
  </g>
</svg>
