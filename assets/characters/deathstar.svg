      <stop offset="0" stop-color="#7A8290"/><stop offset="0.5" stop-color="#4E5562"/><stop offset="1" stop-color="#2F343D"/>
    </linearGradient>
  </defs>
  <g stroke="#30353E" stroke-width="4" stroke-linejoin="round">
