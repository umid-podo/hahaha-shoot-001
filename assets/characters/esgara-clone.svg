<path d="M318 236q22 44 6 104" fill="none" stroke="#30353E" stroke-width="28" stroke-linecap="round"/>
<path d="M318 236q22 44 6 104" fill="none" stroke="#1E2233" stroke-width="18" stroke-linecap="round" stroke-dasharray="14 6"/>
