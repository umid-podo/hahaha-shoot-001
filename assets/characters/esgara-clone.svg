<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<!-- 에스가라 케스가라의 분신: 검은 땋은 머리, 머리 위 선글라스, 흰 셔츠·가슴 파우치, 검은 하카마, 양손 소형 석궁. 오른쪽을 본다. -->
<defs>
  <g id="bow">
    <path d="M0 0h96" stroke="#9AA3AD" stroke-width="5"/>
    <path d="M112 0l-18-7v14z" fill="#D5DAE0" stroke="#30353E" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-6" y="-7" width="84" height="14" rx="3" fill="#3A3F48" stroke="#30353E" stroke-width="4"/>
    <path d="M6 7l-4 26h18l6-26z" fill="#2A2E35" stroke="#30353E" stroke-width="4" stroke-linejoin="round"/>
    <path d="M70 -34q-22 34 0 68" fill="none" stroke="#30353E" stroke-width="10" stroke-linecap="round"/>
    <path d="M70 -34q-18 34 0 68" fill="none" stroke="#565C66" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 -32L34 0L70 32" fill="none" stroke="#E9ECEF" stroke-width="2"/>
  </g>
</defs>
<!-- 하카마(검은 치마바지) -->
<path d="M168 330h140l52 150q-116 22-244 0z" fill="#23262D" stroke="#30353E" stroke-width="8" stroke-linejoin="round"/>
