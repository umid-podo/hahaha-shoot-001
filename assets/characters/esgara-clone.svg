<path d="M262 280q52-14 88-12" fill="none" stroke="#30353E" stroke-width="34" stroke-linecap="round"/>
<path d="M262 280q52-14 88-12" fill="none" stroke="#F4F4F6" stroke-width="24" stroke-linecap="round"/>
<use href="#bow" transform="translate(352 262)"/>
