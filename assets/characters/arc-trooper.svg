<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<!-- 아크 트루퍼(직접 그린 그림): 흰 장갑에 파란 줄무늬, 안테나 달린 헬멧, 등짐, 장갑 치마, 앞으로 겨눈 권총. 오른쪽을 본다. -->
<g stroke="#30353E" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
  <!-- 등짐 -->
  <rect x="148" y="190" width="54" height="120" rx="10" fill="#4A4F57"/>
  <path d="M160 200v-40" fill="none" stroke-width="8"/>
  <!-- 뒤쪽 다리 -->
  <path d="M218 360l-10 70h40l4-70z" fill="#5B6573"/>
  <path d="M206 430h48l6 34h-60z" fill="#D9DDE2"/>
  <path d="M212 392h36" fill="none" stroke="#3E7CD6" stroke-width="10"/>
  <!-- 장갑 치마(카마) -->
  <path d="M190 330h120l18 80q-78 16-160 0z" fill="#6D7682"/>
  <path d="M186 372q70 14 136 0" fill="none" stroke="#3E7CD6" stroke-width="10"/>
  <!-- 앞쪽 다리 -->
  <path d="M258 360l6 70h40l-6-70z" fill="#E8EBEF"/>
  <path d="M262 430h46l12 34h-62z" fill="#D9DDE2"/>
  <path d="M262 398h40" fill="none" stroke="#3E7CD6" stroke-width="10"/>
  <!-- 몸통: 흰 가슴판 + 파란 줄 -->
  <path d="M196 212q58-20 116 0l-8 124h-100z" fill="#EEF1F4"/>
  <path d="M206 244l92 34M204 280l96 32" fill="none" stroke="#3E7CD6" stroke-width="12"/>
  <!-- 허리띠와 주머니 -->
  <rect x="194" y="318" width="124" height="22" rx="5" fill="#C9CED5"/>
  <rect x="204" y="322" width="22" height="30" rx="3" fill="#8E96A1"/>
  <rect x="286" y="322" width="22" height="30" rx="3" fill="#8E96A1"/>
  <!-- 뒤쪽 어깨·팔 -->
  <circle cx="206" cy="226" r="24" fill="#EEF1F4"/>
  <path d="M188 222q14-12 34-4" fill="none" stroke="#3E7CD6" stroke-width="9"/>
  <!-- 헬멧 -->
  <path d="M190 110q10-62 76-64q66 2 72 66l-2 42q-4 22-28 26h-88q-26-4-30-28z" fill="#F4F6F8"/>
  <!-- 헬멧 파란 무늬 -->
  <path d="M224 56q30-10 60 0l-8 30q-22-8-44 0z" fill="#3E7CD6" stroke-width="5"/>
  <path d="M290 130l40-8l2 24l-40 6z" fill="#3E7CD6" stroke-width="5"/>
  <!-- 가로 바이저 -->
  <path d="M244 116h92q6 16-2 30h-90z" fill="#1E2330"/>
  <path d="M252 122h60" fill="none" stroke="#5C6B86" stroke-width="4"/>
  <!-- 턱 호흡기 -->
  <rect x="268" y="156" width="46" height="22" rx="8" fill="#C9CED5"/>
  <circle cx="282" cy="167" r="5" fill="#30353E" stroke-width="0"/>
  <circle cx="300" cy="167" r="5" fill="#30353E" stroke-width="0"/>
  <!-- 안테나 -->
  <path d="M206 76v-58" fill="none" stroke-width="6"/>
  <path d="M192 18h28" fill="none" stroke-width="7"/>
  <rect x="198" y="70" width="18" height="24" rx="4" fill="#8E96A1"/>
  <!-- 앞쪽 팔 + 권총 -->
  <circle cx="290" cy="228" r="24" fill="#EEF1F4"/>
  <path d="M294 236q40 8 74 4" fill="none" stroke="#30353E" stroke-width="36"/>
  <path d="M294 236q40 8 74 4" fill="none" stroke="#DDE2E8" stroke-width="24"/>
  <path d="M318 242q20 2 30 0" fill="none" stroke="#3E7CD6" stroke-width="12"/>
  <rect x="360" y="226" width="68" height="20" rx="4" fill="#2A2E35"/>
  <rect x="424" y="230" width="18" height="10" rx="2" fill="#2A2E35"/>
  <path d="M374 246l-4 30h18l6-30z" fill="#2A2E35"/>
  <circle cx="372" cy="244" r="15" fill="#3B4048"/>
</g>
</svg>
